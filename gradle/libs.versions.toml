[versions]
agp = "9.4.1"
junit = "4.13.2"
androidxTestExt = "1.3.0"
androidxTest = "1.7.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
material = "1.14.0"
activity = "1.13.0"
fragment = "1.9.1"
lifecycle = "2.11.0"
viewpager2 = "1.1.0"
recyclerview = "1.4.0"
core = "1.19.1"
customview = "1.2.0"
# Build tools only, the app does not use these. The Android Gradle Plugin and lint bring them along in versions
# with known security issues; the build files require at least the versions below (bundle "buildToolFixes").
# An entry can go once the plugin asks for that version or a newer one by itself.
# The Kotlin plugin also sets the version of the Kotlin standard library that ends up in the app.
bouncycastle = "1.86"
jose4j = "0.9.7"
jdom2 = "2.0.6.1"
commonsLang3 = "3.21.0"
httpclient = "4.5.14"
kotlin = "2.4.20"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTest" }
test-core = { group = "androidx.test", name = "core", version.ref = "androidxTest" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycle" }
viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "viewpager2" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
core = { group = "androidx.core", name = "core", version.ref = "core" }
customview = { group = "androidx.customview", name = "customview", version.ref = "customview" }
fix-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
fix-bcpkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bouncycastle" }
fix-bcutil = { group = "org.bouncycastle", name = "bcutil-jdk18on", version.ref = "bouncycastle" }
fix-jose4j = { group = "org.bitbucket.b_c", name = "jose4j", version.ref = "jose4j" }
fix-jdom2 = { group = "org.jdom", name = "jdom2", version.ref = "jdom2" }
fix-commons-lang3 = { group = "org.apache.commons", name = "commons-lang3", version.ref = "commonsLang3" }
fix-httpclient = { group = "org.apache.httpcomponents", name = "httpclient", version.ref = "httpclient" }
fix-kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

[bundles]
buildToolFixes = [
    "fix-bcprov", "fix-bcpkix", "fix-bcutil", "fix-jose4j", "fix-jdom2",
    "fix-commons-lang3", "fix-httpclient", "fix-kotlin-gradle-plugin",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
