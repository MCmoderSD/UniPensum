name: Android Build & Release

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: zulu
  GRADLE_ARGS: --no-daemon --no-configuration-cache --console=plain

jobs:
  release:
    name: Build, sign and release
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'release')

    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: setup-java
        name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - id: keystore
        name: Restore signing keystore
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -z "$SIGNING_KEYSTORE" ]; then
            echo "::error::Secret SIGNING_KEYSTORE is not set"
            exit 1
          fi

          KEYSTORE="${RUNNER_TEMP}/release.jks"
          printf '%s' "$SIGNING_KEYSTORE" | base64 --decode --ignore-garbage > "$KEYSTORE"
          echo "path=${KEYSTORE}" >> "$GITHUB_OUTPUT"

      - id: build
        name: Test, lint and build
        env:
          SIGNING_STORE_FILE: ${{ steps.keystore.outputs.path }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ vars.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew $GRADLE_ARGS testDebugUnitTest lintRelease assembleRelease bundleRelease

      - id: project
        name: Resolve app version
        run: |
          METADATA="app/build/outputs/apk/release/output-metadata.json"
          VERSION="$(jq -r '.elements[0].versionName' "$METADATA")"
          VERSION_CODE="$(jq -r '.elements[0].versionCode' "$METADATA")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          case "$VERSION" in
            *-SNAPSHOT) RELEASE=false ;;
            *)          RELEASE=true  ;;
          esac
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"

          if [ "$RELEASE" = true ] && git rev-parse -q --verify "refs/tags/${VERSION}" > /dev/null; then
            echo "::error::Version ${VERSION} is already released, raise appVersion in app/build.gradle.kts"
            exit 1
          fi

          echo "Resolved version ${VERSION}, code ${VERSION_CODE} (GitHub release: ${RELEASE})"

      - id: assets
        name: Collect release assets and checksums
        env:
          VERSION: ${{ steps.project.outputs.version }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"

          if [ -z "$APK" ] || [ -z "$AAB" ]; then
            echo "::error::No build artifact found in app/build/outputs/"
            exit 1
          fi

          mkdir -p release-assets
          cp "$APK" "release-assets/${REPO_NAME}-${VERSION}.apk"
          cp "$AAB" "release-assets/${REPO_NAME}-${VERSION}.aab"

          {
            echo "apk=release-assets/${REPO_NAME}-${VERSION}.apk"
            echo "md5=$(md5sum "$APK" | cut -d ' ' -f 1)"
            echo "sha1=$(sha1sum "$APK" | cut -d ' ' -f 1)"
            echo "sha256=$(sha256sum "$APK" | cut -d ' ' -f 1)"
          } >> "$GITHUB_OUTPUT"

          echo "Release assets:"
          ls -1 release-assets

      - id: verify
        name: Verify APK signature
        env:
          APK: ${{ steps.assets.outputs.apk }}
        run: |
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::No apksigner found in ${ANDROID_HOME}/build-tools"
            exit 1
          fi

          if ! CERTS="$("$APKSIGNER" verify --print-certs "$APK")"; then
            echo "::error::The APK is not signed, check the SIGNING_* secrets and variables"
            exit 1
          fi

          FINGERPRINT="$(echo "$CERTS" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1)"

          if [ -z "$FINGERPRINT" ]; then
            echo "::error::Could not read the signing certificate of the APK"
            exit 1
          fi

          echo "certificate=${FINGERPRINT}" >> "$GITHUB_OUTPUT"
          echo "Signing certificate SHA-256: ${FINGERPRINT}"

      - id: upload
        name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ steps.project.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      # Attestations of a private repository need GitHub Enterprise, so this waits until the repository is public.
      - id: attest
        name: Attest build provenance
        if: steps.project.outputs.release == 'true' && !github.event.repository.private
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*

      - id: changelog
        name: Build changelog link
        if: steps.project.outputs.release == 'true'
        env:
          VERSION: ${{ steps.project.outputs.version }}
        run: |
          PREVIOUS="$(git tag --sort=-creatordate | grep -vFx "$VERSION" | head -n 1 || true)"

          if [ -z "$PREVIOUS" ]; then
            echo "No previous tag found, linking full commit history"
            echo "url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commits/${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "Previous tag: ${PREVIOUS}"
            echo "url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - id: release
        name: Create release
        if: steps.project.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.project.outputs.version }}
          REPO_NAME: ${{ github.event.repository.name }}
          CHANGELOG_URL: ${{ steps.changelog.outputs.url }}
          MD5: ${{ steps.assets.outputs.md5 }}
          SHA1: ${{ steps.assets.outputs.sha1 }}
          SHA256: ${{ steps.assets.outputs.sha256 }}
          CERTIFICATE: ${{ steps.verify.outputs.certificate }}
        run: |
          cat > release-notes.md <<EOF
          **Full Changelog**: ${CHANGELOG_URL}

          ## Checksums (APK):

          - MD5: ${MD5}
          - SHA1: ${SHA1}
          - SHA256: ${SHA256}

          ## Signing certificate:

          - SHA256: ${CERTIFICATE}
          EOF

          gh release create "$VERSION" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "${REPO_NAME} - Release ${VERSION}" \
            --notes-file release-notes.md